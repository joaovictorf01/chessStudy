name: build addon

on:
  push:
    # So tags de versao: a release fixa `puzzles-latest` (workflow puzzles.yml) tambem e uma tag.
    tags: ["v*"]
    # To build on main/master branch, uncomment the following line:
    # branches: [ main , master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        sudo apt-get update  -y
        sudo apt-get install -y gettext
        uv sync

    # O pyright resolve os modulos do NVDA (speech, ui, NVDAObjects...) a partir do codigo
    # do NVDA clonado ao lado do repositorio, como o `extraPaths` do pyproject espera.
    - name: Checkout NVDA source for type checking
      run: git clone --depth 1 https://github.com/nvaccess/nvda.git ../nvda

    - name: Code checks
      run: export PREK_SKIP=no-commit-to-branch; uv run prek run --all-files

    - name: building addon
      run: uv run scons && uv run scons pot

    - uses: actions/upload-artifact@v7
      with:
        name: packaged_addon
        path: |
          ./*.nvda-addon
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        name: translation_template
        path: |
          ./*.pot
        archive: false

  upload_release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: ["build"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: .
        merge-multiple: true
    - name: Display structure of downloaded files
      run: ls -R
    # Release notes: only this version's section of changelog.md ("# Chess Study 2.1.0"
    # up to the next "# " heading), without the heading, plus the package's SHA256.
    - name: Release notes
      run: |
        version="${GITHUB_REF_NAME#v}"
        awk -v heading="# Chess Study $version" '
          $0 == heading { found = 1; next }
          found && /^# / { exit }
          found { print }
        ' changelog.md > release_notes.md
        if ! grep -q '[^[:space:]]' release_notes.md; then
          echo "changelog.md has no section '# Chess Study $version'" >&2
          exit 1
        fi
        echo -e "\nSHA256: " >> release_notes.md
        sha256sum *.nvda-addon >> release_notes.md

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          *.nvda-addon
          *.pot
        body_path: release_notes.md
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref, '-') }}
